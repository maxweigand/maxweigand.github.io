      content="https://avatars.githubusercontent.com/u/6825477?s=460&amp;v=4"
    />

    <!-- The portrait is the LCP element and lives on a third origin: warm up
         DNS + TLS before the preload scanner gets to the <img>. No crossorigin
         attribute — plain <img> requests are not CORS requests, and a
         mismatched preconnect opens a connection the image can't reuse. -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <link
      rel="preload"
      href="fonts/oxygen-300-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <section id="card">
      <!-- Avatar served straight from the CDN: github.com/maxweigand.png is a
           302 to this URL, and the numeric GitHub user id never changes. -->
      <img
        id="portrait"
        src="https://avatars.githubusercontent.com/u/6825477?s=150&amp;v=4"
        srcset="
          https://avatars.githubusercontent.com/u/6825477?s=150&amp;v=4 1x,
          https://avatars.githubusercontent.com/u/6825477?s=300&amp;v=4 2x
        "
        width="150"
        height="150"
        alt="Portrait Max Weigand"
        title="Max Weigand"
        fetchpriority="high"
        decoding="async"
      />

      <div id="card-content">
        <h1>Maximilian Weigand</h1>

        <p>Passionate full stack developer, based in Solingen, GER.</p>

              />
            </svg>
            /
            <a
              target="_blank"
              rel="noopener"
              href="https://github.com/maxweigand"
              >maxweigand</a
            >
          </li>
          <li>
            <svg
              class="icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="0.75" y="2.75" width="14.5" height="10.5" rx="1.75" />
              <path d="M1.6 4 8 8.8 14.4 4" />
            </svg>
            <a id="m" href="mailto:...">...</a>
          </li>
        </ul>

    </section>

    <script>
      function decode() {
        var x = ["max", "weig", "and@", "gmx.", "de"];
        var m = document.getElementById("m");
        m.textContent = x.join("");
        m.href = ["mailto", m.textContent].join(":");
      }
      decode();
    </script>
  </body>
</html>
